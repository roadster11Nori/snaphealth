    function detectMealTypeByTime(date = new Date()) {
      const hour = date.getHours();
      if (hour >= 4 && hour <= 10) return 'BREAKFAST';
      if (hour >= 11 && hour <= 15) return 'LUNCH';
      if (hour >= 17 && hour <= 22) return 'DINNER';
      return 'SNACK';
    }

    function getUtcOffsetSecondsString(date = new Date()) {

      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(
        date.getHours()
      )}:${pad(date.getMinutes())}`;
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(x, y, width, height, radius);
      } else {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }
    }

    // ============================================================================
    // PWA アプリアイコン（PNG DataURL）を Canvas で動的生成
    // ============================================================================
    function generateAppIconDataUrl(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#10b981');
      grad.addColorStop(1, '#0d9488');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.37, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.27, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#059669';
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(size * 0.54, size * 0.46, size * 0.036, 0, Math.PI * 2);
      ctx.fill();

      return canvas.toDataURL('image/png');
    }

    // ============================================================================
    // 画像圧縮・サムネイル生成
    // ============================================================================
    function compressImageToBase64(fileOrDataUrl, maxWidth = 1024, thumbWidth = 240) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const width = Math.round(img.width * scale);
          const height = Math.round(img.height * scale);

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          const base64Data = dataUrl.split(',')[1];

          const thumbScale = Math.min(1, thumbWidth / img.width);
          const tWidth = Math.round(img.width * thumbScale);
          const tHeight = Math.round(img.height * thumbScale);
          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.width = tWidth;
          thumbCanvas.height = tHeight;
          const tCtx = thumbCanvas.getContext('2d');
          tCtx.drawImage(img, 0, 0, tWidth, tHeight);
          const thumbnailDataUrl = thumbCanvas.toDataURL('image/jpeg', 0.7);

          resolve({
            dataUrl,
            thumbnailDataUrl,
            base64Data,
            mimeType: 'image/jpeg'
          });
        };
        img.onerror = () => reject(new Error('画像の読み込みに失敗しました。'));

        if (typeof fileOrDataUrl === 'string') {
          img.src = fileOrDataUrl;
        } else {
          const reader = new FileReader();
          reader.onload = (e) => {
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error('ファイルの読み取りに失敗しました。'));
          reader.readAsDataURL(fileOrDataUrl);
        }
      });
    }

    async function analyzeMealImageWithGemini(base64Data, mimeType, customGeminiKey = '') {

        throw new Error(

        );
      }

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(
        apiKey
      )}`;

      const prompt = `あなたは管理栄養士および食事画像解析AIです。
提供された食事の画像を解析し、写っているすべての料理・飲み物を特定して、それぞれの推定グラム数・カロリー(kcal)・タンパク質(g)・脂質(g)・炭水化物(g)・食物繊維(g)・食塩相当量またはナトリウム(mg)を推定してください。
一般的な日本の1人前の器サイズを基準に現実的な数値を算出し、ワンポイントの栄養アドバイスも日本語で添えてください。`;

      const payload = {
        contents: [
          {
            role: 'user',
            parts: [
              { text: prompt },
              {
                inlineData: {
                  mimeType,
                  data: base64Data
                }
              }
            ]
          }
        ],
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'OBJECT',
            properties: {
              mealTitle: { type: 'STRING' },
              confidenceScore: { type: 'NUMBER' },
              healthTip: { type: 'STRING' },
              items: {
                type: 'ARRAY',
                items: {
                  type: 'OBJECT',
                  properties: {
                    name: { type: 'STRING' },
                    estimatedGrams: { type: 'NUMBER' },
                    kcal: { type: 'NUMBER' },
                    proteinG: { type: 'NUMBER' },
                    fatG: { type: 'NUMBER' },
                    carbsG: { type: 'NUMBER' },
                    fiberG: { type: 'NUMBER' },
                    sugarG: { type: 'NUMBER' },
                    sodiumMg: { type: 'NUMBER' }
                  }
                }
              }
            }
          }
        }
      };

      const delays = [1000, 2000, 4000];
      let lastError = null;

      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errBody = await response.text();
            throw new Error(`Gemini API HTTP ${response.status}: ${errBody}`);
          }

          const result = await response.json();
          const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!jsonText) {
            throw new Error('AIから解析結果のテキストが返されませんでした。');
          }
          return JSON.parse(jsonText);
        } catch (err) {
          lastError = err;
          if (attempt < delays.length) {
            await new Promise((r) => setTimeout(r, delays[attempt]));
          }
        }
      }

      throw lastError || new Error('画像解析に失敗しました。');
    }

    // ============================================================================
    // Google Health API v4 ペイロード生成
    // ============================================================================
    function buildGoogleHealthPayloads({
      mealTitle,
      mealType,
      mealDateTimeStr,
      items,
      portionMultiplier,
      splitDishes
    }) {
      const startDate = mealDateTimeStr ? new Date(mealDateTimeStr) : new Date();
      const endDate = new Date(startDate.getTime() + 25 * 60 * 1000);
      const utcOffset = getUtcOffsetSecondsString(startDate);

      const interval = {
        startTime: startDate.toISOString(),
        startUtcOffset: utcOffset,
        endTime: endDate.toISOString(),
        endUtcOffset: utcOffset
      };

      const round1 = (v) => Math.round((Number(v) || 0) * 10) / 10;
      const round3 = (v) => Math.round((Number(v) || 0) * 1000) / 1000;
      const activeItems = (items || []).filter((item) => item.included !== false);

      if (splitDishes && activeItems.length > 1) {
        return activeItems.map((item) => {
          const kcal = Math.round((item.kcal || 0) * portionMultiplier);
          const fatG = round1((item.fatG || 0) * portionMultiplier);
          const carbsG = round1((item.carbsG || 0) * portionMultiplier);
          const proteinG = round1((item.proteinG || 0) * portionMultiplier);
          const fiberG = round1((item.fiberG || 0) * portionMultiplier);
          const sugarG = round1((item.sugarG || 0) * portionMultiplier);
          const sodiumGrams = round3(((item.sodiumMg || 0) * portionMultiplier) / 1000);

          return {
            nutritionLog: {
              interval,
              foodDisplayName: item.name,
              mealType,
              energy: { kcal },
              energyFromFat: { kcal: Math.round(fatG * 9) },
              totalCarbohydrate: { grams: carbsG },
              totalFat: { grams: fatG },
              nutrients: [
                { nutrient: 'PROTEIN', quantity: { grams: proteinG } },
                { nutrient: 'DIETARY_FIBER', quantity: { grams: fiberG } },
                { nutrient: 'SUGAR', quantity: { grams: sugarG } },
                { nutrient: 'SODIUM', quantity: { grams: sodiumGrams } }
              ],
              serving: { amount: round1(portionMultiplier) }
            }
          };
        });
      }

      const totals = activeItems.reduce(
        (acc, item) => ({
          kcal: acc.kcal + (item.kcal || 0) * portionMultiplier,
          proteinG: acc.proteinG + (item.proteinG || 0) * portionMultiplier,
          fatG: acc.fatG + (item.fatG || 0) * portionMultiplier,
          carbsG: acc.carbsG + (item.carbsG || 0) * portionMultiplier,
          fiberG: acc.fiberG + (item.fiberG || 0) * portionMultiplier,
          sugarG: acc.sugarG + (item.sugarG || 0) * portionMultiplier,
          sodiumMg: acc.sodiumMg + (item.sodiumMg || 0) * portionMultiplier
        }),
        { kcal: 0, proteinG: 0, fatG: 0, carbsG: 0, fiberG: 0, sugarG: 0, sodiumMg: 0 }
      );

      return [
        {
          nutritionLog: {
            interval,
            foodDisplayName:
              mealTitle || activeItems.map((i) => i.name).join('・') || 'AI記録の食事',
            mealType,
            energy: { kcal: Math.round(totals.kcal) },
            energyFromFat: { kcal: Math.round(totals.fatG * 9) },
            totalCarbohydrate: { grams: round1(totals.carbsG) },
            totalFat: { grams: round1(totals.fatG) },
            nutrients: [
              { nutrient: 'PROTEIN', quantity: { grams: round1(totals.proteinG) } },
              { nutrient: 'DIETARY_FIBER', quantity: { grams: round1(totals.fiberG) } },
              { nutrient: 'SUGAR', quantity: { grams: round1(totals.sugarG) } },
              { nutrient: 'SODIUM', quantity: { grams: round3(totals.sodiumMg / 1000) } }
            ],
            serving: { amount: round1(portionMultiplier) }
          }
        }
      ];
    }

        if (!settings.googleClientId.trim()) {

          return;
        }

        const initTokenClient = () => {
          try {
            const tokenClient = window.google.accounts.oauth2.initTokenClient({
              client_id: settings.googleClientId.trim(),
              scope: GOOGLE_HEALTH_SCOPE,
              include_granted_scopes: false,
              callback: (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                  setSettings((prev) => ({
                    ...prev,
                    accessToken: tokenResponse.access_token,
                    syncMode: 'live'
                  }));
                  showToast('Google Health API の認証に成功しました！', 'success');
                } else {
                  showToast('アクセストークンの取得に失敗しました。', 'error');
                }
              }
            });
            tokenClient.requestAccessToken();
          } catch (err) {
            showToast(`OAuth 初期化エラー: ${err.message}`, 'error');
          }
        };

        if (window.google?.accounts?.oauth2) {
          initTokenClient();
        } else {
          const script = document.createElement('script');
          script.src = 'https://accounts.google.com/gsi/client';
          script.async = true;
          script.onload = initTokenClient;
          script.onerror = () =>
            showToast('Google Identity スクリプトの読み込みに失敗しました。', 'error');
          document.body.appendChild(script);
        }
      };

      const syncToGoogleHealth = useCallback(
        async ({

          targetMealType,
          targetDateTime,
          targetMultiplier

          const dataToSync = targetAnalysis || analysisResult;
          if (!dataToSync || !dataToSync.items?.length) {
            showToast('記録する料理データがありません。', 'error');
            return;
          }

          const payloads = buildGoogleHealthPayloads({
            mealTitle: dataToSync.mealTitle,
            mealType: targetMealType || mealType,
            mealDateTimeStr: targetDateTime || mealDateTime,
            items: dataToSync.items,
            portionMultiplier: targetMultiplier ?? portionMultiplier,
            splitDishes: settings.splitDishes
          });

          setIsSyncing(true);
          try {
            let resourceNames = [];
            let syncedLive = false;

            if (settings.syncMode === 'live') {
              if (!settings.accessToken.trim()) {
                throw new Error(
                  'Google Health 本番連携モードにはアクセストークンが必要です。「連携設定」から認証するか、デモモードに切り替えてください。'
                );
              }

              for (const body of payloads) {
                const res = await fetch(GOOGLE_HEALTH_ENDPOINT, {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${settings.accessToken.trim()}`,
                    'Content-Type': 'application/json',
                    Accept: 'application/json'
                  },
                  body: JSON.stringify(body)
                });

                if (!res.ok) {
                  const errText = await res.text();
                  throw new Error(`Google Health API (${res.status}): ${errText}`);

                const resJson = await res.json();
                resourceNames.push(

                fiberG: Math.round(summary.fiberG * 10) / 10,
